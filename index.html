<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f0f0f0">
    <meta name="description" content="提供B2觀眾停車場、B1演職人員停車場車格號碼、柱號的檢索與路線導引">
    <title>B2停車場導航</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body { margin: 0; padding: 0; background: #eee; overflow: hidden; }

        #map {
            height: 100vh; width: 100vw;
            background-color: #f0f0f0;
            transition: transform 0.25s ease-out, scale 0.3s ease-in-out;
            transform-origin: center center;
        }

        #map.compass-mode { scale: 2.2; }

        .search-container {
            position: absolute; top: 12px; left: 12px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 10px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 260px;
            font-family: sans-serif;
        }
        #routeStatus {
            font-size: 15px; margin-bottom: 8px; text-align: center; display: none;
            background: #fff5f5; padding: 6px; border-radius: 8px;
            border: 1px solid #fab1a0; font-weight: bold; color: #d63031;
        }
        #routeStatus .route-hint { display: block; font-size: 12px; font-weight: normal; color: #636e72; margin-top: 4px; }
        #routeStatus .route-next {
            display: block; width: 100%; margin-top: 6px; padding: 7px; border: none; border-radius: 6px;
            background: #d63031; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer;
        }

        /* 輸入框：左側樓層鍵 + 右側輸入內容 */
        .input-row {
            display: flex; height: 42px; margin-bottom: 8px;
            border: 2px solid #ccc; border-radius: 8px; background: #fff;
            box-sizing: border-box; overflow: hidden;
        }
        #floorBadge {
            flex: 0 0 52px; border: none; border-right: 2px solid #ccc;
            font-size: 17px; font-weight: bold; color: #fff; cursor: pointer;
            background: #2f3542; display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        #floorBadge::after {
            content: ""; border-left: 4px solid transparent; border-right: 4px solid transparent;
            border-top: 5px solid rgba(255,255,255,0.75);
        }
        #floorBadge.is-b1 { background: #6c5ce7; }
        #floorBadge:active { filter: brightness(0.85); }
        #combinedInput {
            flex: 1; min-width: 0; height: 100%; font-size: 18px; text-align: center;
            border: none; outline: none; background: transparent; cursor: pointer;
        }
        .keypad { display: none; flex-direction: row; gap: 8px; }
        .keypad.active { display: flex; }
        .keypad-letters { display: flex; flex-direction: column; gap: 5px; flex: 0.8; }
        .keypad-main { display: flex; flex-direction: column; gap: 5px; flex: 3.5; }
        .key-row { display: flex; justify-content: space-between; gap: 5px; }

        .key-btn {
            flex: 1; height: 44px; font-size: 16px; font-weight: bold;
            cursor: pointer; border: 1px solid #bbb; border-radius: 6px;
            background: #ffffff; color: #333; display: flex; align-items: center; justify-content: center;
        }
        .key-btn:active { background: #ddd; transform: scale(0.95); }

        .btn-a { background-color: #DABE00 !important; color: white; border: none; }
        .btn-b { background-color: #E98B19 !important; color: white; border: none; }
        .btn-c { background-color: #E50012 !important; color: white; border: none; }
        .btn-d { background-color: #0072BE !important; color: white; border: none; }
        .btn-e { background-color: #2B8D56 !important; color: white; border: none; }

        .key-btn.func-clear { background: #fff5f5; color: #e03131; border-color: #ffa8a8; }
        .key-btn.func-search { background: #f4fce3; color: #2f9e44; border-color: #c0eb75; }

        .key-btn.nav-point {
            background-color: #f1f2f6;
            font-size: 13px;
            border: 2px solid #ddd;
        }

        /* 按鈕群組 */
        .floating-btns {
            position: absolute; top: 12px; right: 12px; z-index: 1000;
            display: flex; flex-direction: column; gap: 12px;
        }

        .side-btn {
            width: 48px; height: 48px; background: white;
            border: 2px solid #ccc; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            text-decoration: none; color: black;
        }
        #compassBtn.active { background: #ff4757; color: white; border-color: #d63031; }
        #occupancyBtn.active { background: #2f3542; border-color: #000; color: white; }

        /* 樓層切換（B1 在上、B2 在下，對應實際樓層位置） */
        .floor-switch {
            position: absolute; right: 12px; bottom: 36px; z-index: 1000;
            display: flex; flex-direction: column; overflow: hidden;
            background: #fff; border: 2px solid #ccc; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-family: sans-serif;
        }
        .floor-switch button {
            width: 64px; padding: 8px 0 6px; border: none; background: #fff; cursor: pointer;
            font-size: 18px; font-weight: bold; color: #2f3542; line-height: 1.1;
        }
        .floor-switch button + button { border-top: 1px solid #ddd; }
        .floor-switch button small { display: block; font-size: 10px; font-weight: normal; color: #888; margin-top: 2px; }
        .floor-switch button.active { background: #2f3542; color: #fff; }
        .floor-switch button.active small { color: #dfe4ea; }
        .floor-switch button[data-floor="B1"].active { background: #6c5ce7; }
        .floor-switch button.has-route::before { content: "● "; color: #ff4757; font-size: 11px; vertical-align: middle; }

        .popup-nav-container { text-align: center; padding: 5px; }
        .popup-btn {
            display: block; width: 100%; margin-top: 8px; padding: 10px;
            border-radius: 5px; border: 1px solid #ccc; font-weight: bold;
            cursor: pointer; font-size: 14px; box-sizing: border-box;
        }
        .popup-btn.from { background: #0984e3; color: white; border: none; }
        .popup-btn.to { background: #d63031; color: white; border: none; }

        /* 彈出式視窗背景（遮罩） */
        .modal-overlay {
            display: none; /* 預設隱藏 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* 半透明黑 */
            z-index: 9999; /* 確保在最上層 */
            backdrop-filter: blur(4px); /* 背景模糊，增加質感 */
            cursor: no-drop;
        }

        /* 彈出式視窗主體 */
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 800px; /* 最大寬度 */
            height: 80vh; /* 高度佔螢幕 80% */
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: auto;
        }

        /* 彈出式視窗標題列 */
        .modal-header {
            padding: 15px 20px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }

        #closeModal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        /* 內嵌網頁區域 */
        .modal-body {
            flex: 1;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 手機版適應 */
        @media (max-width: 600px) {
            .modal-content {
                width: 95%;
                height: 90vh;
            }
        }
    </style>
</head>
<body>

<div class="floating-btns">
    <div id="compassBtn" class="side-btn" onclick="toggleCompass()" title="啟動陀螺儀">🧭</div>
    <a href="javascript:void(0)" id="openInstant" class="side-btn" title="停泊即時資訊">🔗</a>
    <div id="occupancyBtn" class="side-btn" onclick="toggleOccupancy()" title="顯示即時車位">🚥</div>
</div>

<div id="floorSwitch" class="floor-switch">
    <button data-floor="B1" onclick="showFloor('B1')" title="B1演職人員停車場">B1<small>演職人員</small></button>
    <button data-floor="B2" class="active" onclick="showFloor('B2')" title="B2觀眾停車場">B2<small>觀眾</small></button>
</div>

<div class="search-container">
    <div id="routeStatus"></div>
    <div class="input-row">
        <button id="floorBadge" onclick="toggleInputFloor(event)" title="切換樓層">B2</button>
        <input type="text" id="combinedInput" placeholder="點擊搜尋/導航" readonly onclick="toggleKeypad()">
    </div>

    <div id="keypadSection" class="keypad">
        <div class="keypad-letters">
            <button class="key-btn btn-a" onclick="appendKey('A')">A</button>
            <button class="key-btn btn-b" onclick="appendKey('B')">B</button>
            <button class="key-btn btn-c" onclick="appendKey('C')">C</button>
            <button class="key-btn btn-d" onclick="appendKey('D')">D</button>
            <button class="key-btn btn-e" onclick="appendKey('E')">E</button>
        </div>

        <div class="keypad-main">
            <div class="key-row"><button class="key-btn" onclick="appendKey('1')">1</button><button class="key-btn" onclick="appendKey('2')">2</button><button class="key-btn" onclick="appendKey('3')">3</button></div>
            <div class="key-row"><button class="key-btn" onclick="appendKey('4')">4</button><button class="key-btn" onclick="appendKey('5')">5</button><button class="key-btn" onclick="appendKey('6')">6</button></div>
            <div class="key-row"><button class="key-btn" onclick="appendKey('7')">7</button><button class="key-btn" onclick="appendKey('8')">8</button><button class="key-btn" onclick="appendKey('9')">9</button></div>
            <div class="key-row">
                <button class="key-btn func-clear" onclick="clearInput()">清除</button>
                <button class="key-btn" onclick="appendKey('0')">0</button>
                <button class="key-btn func-search" onclick="executeSearch()">搜尋</button>
            </div>
            <div class="key-row">
                <button class="key-btn nav-point" style="color:#0984e3" onclick="setPoint('from')">設為起點</button>
                <button class="key-btn nav-point" style="color:#d63031" onclick="setPoint('to')">設為終點</button>
            </div>
        </div>
    </div>
</div>

<!-- 停泊現況彈出式視窗結構 -->
<div id="modalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <span>停車場現況</span>
            <div style="display: flex; align-items: center;">
                <button id="refreshModal" title="重新整理" style="background:none; border:none; cursor:pointer; font-size:20px; margin-right:15px;">↻</button>
                <button id="closeModal" title="關閉" style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
            </div>
        </div>
        <div class="modal-body" style="flex:1;">
            <iframe id="instantIframe" src="" frameborder="0" style="width:100%; height:100%;"></iframe>
        </div>
    </div>
</div>

<div id="map"></div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
    }

    const imageBounds = [[22.62193, 120.34105], [22.62406, 120.34360]];
    const API_URL = "https://analytics.sto-tek.com/_nodered/api/callExternalAPI?apiKey=495370807e744c8685b05ed5aabc3712&EAPI=API_Building_02&buildingID=kaohsiung_weiwuying&s=&m=lpr&p=0";

    const roadNetwork = {
        "nodes": {
            "A1": [120.34124, 22.62270], "A3": [120.34137, 22.62307], "A4": [120.34149, 22.62344], "A5": [120.34164, 22.62391],
            "B1": [120.34175, 22.62254], "B3": [120.34188, 22.62290], "B4": [120.34200, 22.62327], "B5": [120.34216, 22.62374],
            "C1": [120.34250, 22.62227], "C2": [120.34256, 22.62244], "C3": [120.34263, 22.62265], "C4": [120.34275, 22.62301], "C5": [120.34291, 22.62348],
            "D1": [120.34308, 22.62208], "D2": [120.34313, 22.62225], "D4": [120.34332, 22.62282], "D5": [120.34347, 22.62329]
        },
        "edges": [
            ["A1","A3"], ["A3","A4"], ["A4","A5"], ["B1","B3"], ["B3","B4"], ["B4","B5"],
            ["C1","C2"], ["C2","C3"], ["C3","C4"], ["C4","C5"], ["D1","D2"], ["D2","D4"], ["D4","D5"],
            ["A1","B1"], ["B1","C1"], ["C1","D1"], ["C2","D2"], ["A3","B3"], ["B3","C3"],
            ["A4","B4"], ["C4","D4"], ["A5","B5"], ["B5","C5"], ["C5","D5"]
        ]
    };

    // --- 樓層設定：B2 觀眾停車場為主、B1 演職人員停車場為輔 ---
    // B1 路網由 tools/build_b1.py 產生，存放於 parking-b1.geojson 的 road_network
    const FLOOR_CONFIG = {
        B2: { svg: 'B2-20260503.svg', data: 'parking.geojson', label: 'B2F' },
        B1: { svg: 'B1-20260501-geo.svg', data: 'parking-b1.geojson', label: 'B1F' }
    };
    // 可往返 B1、B2 的樓梯及電梯（兩層的 geojson 皆有同名區域）
    const CONNECTORS = [
        { name: '入口大廳風除室及梯廳', short: '入口大廳梯廳', icon: 'EV.svg' },
        { name: '潮台菜旁通往1F榕樹廣場、戶外劇場樓梯', short: '潮台菜旁樓梯', icon: 'stair.svg' }
    ];
    // 場館 CI 指引標示（電梯 / 樓梯）
    const ciImg = (c, size) => `<img src="${c.icon}" alt="${c.short}" style="width:${size}px;height:${size}px;vertical-align:-3px;border-radius:2px">`;
    const floors = {}; // { B2: { group, geojson, network, occupied }, B1: {...} }
    let currentFloor = 'B2';

    const redFlagIcon = L.divIcon({
        html: '<div style="font-size: 38px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3));">🚩</div>',
        className: '', iconSize: [40, 40], iconAnchor: [10, 38]
    });
    const connectorIcon = (c) => L.divIcon({
        html: `<div style="filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3));">${ciImg(c, 32)}</div>`,
        className: '', iconSize: [32, 32], iconAnchor: [16, 16]
    });

    let currentInput = "", activeSpot = null; // activeSpot: { floor, layer }
    let startData = null, endData = null, startMarker = null, endMarker = null;
    let routeLegs = []; // [{ floor, line, connectorMarker }]
    let fixedStart = null; // 由 ?start= 帶入的固定起點 { floor, name, pos }，點選地圖即直接設為終點
    let isOccupancyMode = false;

    const map = L.map('map', { center: [22.6231, 120.3425], zoom: 19, maxZoom: 24, minZoom: 17, zoomControl: false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_3lmo_1_f08edeed88f66c633461dbcb', { opacity: 0.4, maxZoom: 24, maxNativeZoom: 19 }).addTo(map);

    Object.keys(FLOOR_CONFIG).forEach(f => {
        floors[f] = { group: L.layerGroup(), geojson: null, network: f === 'B2' ? roadNetwork : null, occupied: new Set() };
        L.imageOverlay(FLOOR_CONFIG[f].svg, imageBounds, { opacity: 0.8, interactive: false }).addTo(floors[f].group);
    });
    floors.B2.group.addTo(map);

    // --- 載入數據 ---
    function buildGeojsonLayer(floor, data) {
        return L.geoJSON(data, {
            pointToLayer: (f, l) => L.circleMarker(l, { radius: 3, fillColor: "#bfbfbf", color: "#bfbfbf", weight: 0.1, opacity: 0.1, fillOpacity: 0.1 }),
            style: (feature) => ({
                color: "#bfbfbf", opacity: 0, weight: 0, fillColor: "#333", fillOpacity: 0
            }),
            onEachFeature: function(feature, layer) {
                const name = feature.properties.name;
                const roadId = feature.properties.road_id;
                const title = `<span style="color:#888">${FLOOR_CONFIG[floor].label}</span> <b>${name}</b>`;

                if (roadId) {
                    const popupContent = `
                        <div class="popup-nav-container">
                            ${title}
                            <button class="popup-btn from" onclick="setPointViaMap('${floor}', '${name}', 'from')">設為起點</button>
                            <button class="popup-btn to" onclick="setPointViaMap('${floor}', '${name}', 'to')">設為終點</button>
                        </div>
                    `;
                    layer.bindPopup(popupContent);
                    // 固定起點模式：點選即設為終點並規劃路線，不需再按彈窗按鈕
                    layer.on('click', () => {
                        if (!fixedStart || (fixedStart.floor === floor && fixedStart.name.toString().toUpperCase() === name.toString().toUpperCase())) return;
                        setPointViaMap(floor, name, 'to');
                    });
                } else {
                    layer.bindPopup(title);
                }
            }
        });
    }

    const dataReady = Promise.all(Object.keys(FLOOR_CONFIG).map(f =>
        fetch(FLOOR_CONFIG[f].data).then(res => res.json()).then(data => {
            if (data.road_network) floors[f].network = data.road_network;
            floors[f].geojson = buildGeojsonLayer(f, data).addTo(floors[f].group);
        })
    )).then(() => {
        const params = new URLSearchParams(location.search);
        // 由定點 QR code 開啟時，以 ?start=戲劇院B2票口 帶入固定起點（同名區域可加 &floor=B1 指定樓層）
        const start = params.get('start');
        if (start) setFixedStart(start, params.get('floor'));
        // 以 ?guide= 帶入終點：車格代碼 B1F-052（「停泊即時資訊」獨立開啟時使用）、柱號 A01 或區域名稱
        const guide = params.get('guide');
        if (guide) startGuide('', guide, params.get('floor'));
    });

    // --- 樓層切換 ---
    function showFloor(floor) {
        if (!floors[floor]) return;
        if (floor !== currentFloor) {
            map.closePopup();
            map.removeLayer(floors[currentFloor].group);
            floors[floor].group.addTo(map);
            currentFloor = floor;
        }
        const badge = document.getElementById('floorBadge');
        badge.textContent = floor;
        badge.classList.toggle('is-b1', floor === 'B1');
        document.querySelectorAll('#floorSwitch button').forEach(b => {
            b.classList.toggle('active', b.dataset.floor === floor);
            b.classList.toggle('has-route', routeLegs.some(l => l.floor === b.dataset.floor));
        });
        updateRouteStatus();
        const leg = routeLegs.find(l => l.floor === floor);
        if (leg) {
            // 上方預留搜尋面板高度，避免路線被遮住
            const panel = document.querySelector('.search-container');
            map.fitBounds(leg.line.getBounds(), { paddingTopLeft: [30, panel.offsetTop + panel.offsetHeight + 30], paddingBottomRight: [30, 50] });
        }
    }

    function toggleInputFloor(e) {
        e.stopPropagation();
        showFloor(currentFloor === 'B2' ? 'B1' : 'B2');
    }

    // --- 當使用者在使用中突然斷網時，自動關閉車位顯示模式，確保地圖回歸穩定狀態
    window.addEventListener('offline', () => {
        if (isOccupancyMode) {
            toggleOccupancy(); // 自動切換為關閉狀態
            alert("網路連線已斷開，切換至離線導航模式。");
        }
    });

let occupancyTimer = null; // 新增計時器變數

    // --- 即時車位顯示邏輯 ---
    async function toggleOccupancy() {
        const btn = document.getElementById('occupancyBtn');

        // 1. 離線檢查
        if (!navigator.onLine) {
            alert("目前為離線狀態，無法取得即時車位資訊。\n搜尋與導航功能仍可正常使用。");
            isOccupancyMode = false;
            btn.classList.remove('active');
            return;
        }

        isOccupancyMode = !isOccupancyMode;

        if (isOccupancyMode) {
            btn.classList.add('active');
            await refreshOccupancy();

            // 設定定時更新
            occupancyTimer = setInterval(async () => {
                // 自動更新時若斷網，就靜默停止，不彈出視窗打擾使用者
                if (navigator.onLine) {
                    await refreshOccupancy();
                } else {
                    console.log("偵測到離線，暫停自動更新");
                }
            }, 60000);

        } else {
            btn.classList.remove('active');
            if (occupancyTimer) {
                clearInterval(occupancyTimer);
                occupancyTimer = null;
            }
            resetOccupancyStyle();
        }
    }

    // 將抓取與套用樣式封裝成一個函式，方便重複呼叫
async function refreshOccupancy() {
        const btn = document.getElementById('occupancyBtn');
        const originalIcon = "🚥";

        try {
            btn.innerHTML = "⌛";
            await fetchOccupancyData();
            applyOccupancyStyle();
            btn.innerHTML = originalIcon;
        } catch (e) {
            // 抓取失敗時 (例如 API 伺服器掛掉或瞬間斷網)
            console.error("更新失敗", e);
            btn.innerHTML = "⚠️"; // 顯示警告圖示
            // 如果是自動更新中失敗，不關閉模式，等下一分鐘再試
            if (!isOccupancyMode) btn.classList.remove('active');
        }
    }

    // 解析車格代碼，例如 "B1F-052"、"B2F_123"，或 Floor="B1F" + "052"
    function parseSpotCode(floorStr, numStr) {
        const raw = String(numStr || '').toUpperCase();
        const fm = /B\s*([12])/.exec(raw) || /B\s*([12])/.exec(String(floorStr || '').toUpperCase());
        const nm = /(\d+)\s*$/.exec(raw.replace(/^B\s*[12]\s*F?/, ''));
        if (!fm || !nm) return null;
        return { floor: 'B' + fm[1], spot: parseInt(nm[1], 10).toString() };
    }

    function isPlateEmpty(p) {
        return !p || p === "Empty" || p === "NONE";
    }

    // 具備「去零」邏輯的資料抓取函式，B1、B2 分別記錄
    async function fetchOccupancyData() {
        try {
            // 加入 timeout 機制，避免網路太慢時轉圈圈太久 (5秒超時)
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            const response = await fetch(API_URL, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (!response.ok) throw new Error("API 回應錯誤");

            const result = await response.json();
            Object.values(floors).forEach(f => f.occupied.clear());

            const carData = result.data || result;
            if (Array.isArray(carData)) {
                carData.forEach(item => {
                    const code = parseSpotCode(item.Floor, item.ParkingNumber);
                    if (code && floors[code.floor] && !isPlateEmpty(item.LicensePlate)) {
                        floors[code.floor].occupied.add(code.spot);
                    }
                });
            }
        } catch (e) {
            throw e; // 丟給 refreshOccupancy 處理 UI
        }
    }

    const OCCUPIED_STYLE = { fillOpacity: 0.7, fillColor: "#2d3436", color: "#000", opacity: 0.5 };
    const HIGHLIGHT_STYLE = { color: '#ff0000', opacity: 1, weight: 4, fillColor: '#ffff00', fillOpacity: 0.7 };

    function applyOccupancyStyle() {
        Object.values(floors).forEach(f => {
            if (!f.geojson) return;
            f.geojson.eachLayer(layer => {
                if (activeSpot && activeSpot.layer === layer) return;
                if (f.occupied.has(layer.feature.properties.name.toString())) layer.setStyle(OCCUPIED_STYLE);
                else f.geojson.resetStyle(layer); // 未占用的保持原本樣式
            });
        });
    }

    function resetOccupancyStyle() {
        Object.values(floors).forEach(f => {
            if (!f.geojson) return;
            f.geojson.eachLayer(layer => {
                // 如果這格不是當前搜尋選中的格子，就重置
                if (!activeSpot || activeSpot.layer !== layer) f.geojson.resetStyle(layer);
            });
        });
    }

    // --- 輔助功能 ---
    function formatInput(val) {
        val = val.toUpperCase();
        if (val.length === 2 && /[A-E]/.test(val[0]) && /\d/.test(val[1])) return val[0] + '0' + val[1];
        if (/^\d+$/.test(val)) return parseInt(val, 10).toString(); // 052 → 52
        return val;
    }

    function findFeature(floor, name) {
        const f = floors[floor];
        if (!f || !f.geojson) return null;
        let target = null;
        f.geojson.eachLayer(l => { if (l.feature.properties.name.toString().toUpperCase() === name) target = l; });
        return target;
    }

    // 依名稱或車格代碼（例如 戲劇院B2票口、B1F-052、A01）尋找導航點，preferFloor 優先，其次 B2、B1
    function resolvePoint(str, preferFloor) {
        // 柱號（例如 B25）不可當成車格代碼解析，否則會被誤判為 B2 第 5 格
        const isPillar = /^[A-E]\d{1,2}$/i.test(str.trim());
        const code = !isPillar && parseSpotCode('', str);
        if (code) {
            const l = findFeature(code.floor, code.spot);
            if (l) return { floor: code.floor, name: code.spot, layer: l };
        }
        const name = formatInput(str.trim());
        const order = [preferFloor && preferFloor.toUpperCase(), 'B2', 'B1'].filter(f => floors[f]);
        for (const f of order) {
            const l = findFeature(f, name);
            if (l && l.feature.properties.road_id) return { floor: f, name: l.feature.properties.name, layer: l };
        }
        return null;
    }

    function layerPos(l) { return l.getLatLng ? l.getLatLng() : l.getBounds().getCenter(); }

    function notFoundMsg(floor, name) {
        return `${floor} 無此編號: ${name}`;
    }

    // --- 羅盤邏輯 ---
    let isCompassActive = false;
    function toggleCompass() {
        if (!isCompassActive) {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') startCompass();
                });
            } else { startCompass(); }
        } else { stopCompass(); }
    }
    function startCompass() {
        isCompassActive = true;
        document.getElementById('compassBtn').classList.add('active');
        document.getElementById('map').classList.add('compass-mode');
        map.dragging.disable();
        if (startData) map.panTo(startData.pos);
        window.addEventListener('deviceorientation', handleOrientation);
    }
    function stopCompass() {
        isCompassActive = false;
        document.getElementById('compassBtn').classList.remove('active');
        document.getElementById('map').classList.remove('compass-mode');
        map.dragging.enable();
        window.removeEventListener('deviceorientation', handleOrientation);
        document.getElementById('map').style.transform = `rotate(0deg)`;
    }
    function handleOrientation(event) {
        let heading = event.webkitCompassHeading || (360 - event.alpha);
        if (heading) {
            document.getElementById('map').style.transform = `rotate(${-heading}deg)`;
            if (startData) map.panTo(startData.pos, {animate: false});
        }
    }

    // --- 導航核心邏輯 ---
    function calcDist(p1, p2) { return Math.sqrt(Math.pow(p1[0]-p2[0],2) + Math.pow(p1[1]-p2[1],2)) * 100000; }
    function dijkstra(net, start, end) {
        const graph = {};
        for (let id in net.nodes) graph[id] = {};
        net.edges.forEach(([u, v]) => {
            const d = calcDist(net.nodes[u], net.nodes[v]);
            graph[u][v] = d; graph[v][u] = d;
        });
        const dists = {}, prevs = {}, pq = new Set(Object.keys(graph));
        Object.keys(graph).forEach(n => dists[n] = Infinity);
        dists[start] = 0;
        while(pq.size) {
            let u = Array.from(pq).reduce((a, b) => dists[a] < dists[b] ? a : b);
            if (u === end || dists[u] === Infinity) break;
            pq.delete(u);
            for (let v in graph[u]) {
                let alt = dists[u] + graph[u][v];
                if (alt < dists[v]) { dists[v] = alt; prevs[v] = u; }
            }
        }
        const path = []; let curr = end;
        while(curr) { path.unshift(curr); curr = prevs[curr]; }
        return path;
    }

    function getProjectionPoint(P, A, B) {
        const x1 = A[0], y1 = A[1], x2 = B[0], y2 = B[1], px = P.lng, py = P.lat;
        const dx = x2-x1, dy = y2-y1;
        let t = Math.max(0, Math.min(1, ((px-x1)*dx + (py-y1)*dy) / (dx*dx + dy*dy)));
        return [x1 + t*dx, y1 + t*dy];
    }

    function getNearestPathInfo(net, latlng) {
        let minD = Infinity, best = null;
        net.edges.forEach(([u, v]) => {
            const proj = getProjectionPoint(latlng, net.nodes[u], net.nodes[v]);
            const d = calcDist([latlng.lng, latlng.lat], proj);
            if (d < minD) { minD = d; best = { proj, nodes: [u, v] }; }
        });
        return best;
    }

    // 計算單一樓層內兩點間的路徑，回傳 { latlngs, dist }
    function routeOnFloor(floor, fromPos, toPos) {
        const net = floors[floor].network;
        const sInfo = getNearestPathInfo(net, fromPos), eInfo = getNearestPathInfo(net, toPos);
        if (!sInfo || !eInfo) return null;
        const from = [fromPos.lng, fromPos.lat], to = [toPos.lng, toPos.lat];
        let bestPath = null, minTotalDist = Infinity;
        // 起訖點投影在同一段車道上時，直接沿車道前進
        if (sInfo.nodes.join() === eInfo.nodes.join()) {
            minTotalDist = calcDist(from, sInfo.proj) + calcDist(sInfo.proj, eInfo.proj) + calcDist(eInfo.proj, to);
            bestPath = [];
        }
        sInfo.nodes.forEach(sNode => eInfo.nodes.forEach(eNode => {
            const path = dijkstra(net, sNode, eNode);
            if (path[0] !== sNode) return; // 不連通
            let total = calcDist(from, sInfo.proj) + calcDist(sInfo.proj, net.nodes[sNode]);
            for(let i=0; i<path.length-1; i++) total += calcDist(net.nodes[path[i]], net.nodes[path[i+1]]);
            total += calcDist(net.nodes[eNode], eInfo.proj) + calcDist(eInfo.proj, to);
            if (total < minTotalDist) { minTotalDist = total; bestPath = path; }
        }));
        if (!bestPath) return null;
        let final = [[fromPos.lat, fromPos.lng], [sInfo.proj[1], sInfo.proj[0]]];
        bestPath.forEach(id => final.push([net.nodes[id][1], net.nodes[id][0]]));
        final.push([eInfo.proj[1], eInfo.proj[0]], [toPos.lat, toPos.lng]);
        return { latlngs: final, dist: minTotalDist };
    }

    // 標記屬於樓層圖層群組，必須從群組移除，否則切回該樓層會再出現
    function removeMarker(m) {
        if (m) Object.values(floors).forEach(f => f.group.removeLayer(m));
    }

    function clearRoute() {
        routeLegs.forEach(l => {
            floors[l.floor].group.removeLayer(l.line);
            if (l.connectorMarker) floors[l.floor].group.removeLayer(l.connectorMarker);
        });
        routeLegs = [];
    }

    function drawRoute() {
        clearRoute();
        const legs = [];
        let via = null;
        if (startData.floor === endData.floor) {
            const r = routeOnFloor(startData.floor, startData.pos, endData.pos);
            if (!r) return;
            legs.push({ floor: startData.floor, latlngs: r.latlngs });
        } else {
            // 跨樓層：先指引到樓梯或電梯，再由另一層的同一處前往終點，取總距離最短者
            let best = null;
            CONNECTORS.forEach(c => {
                const a = findFeature(startData.floor, c.name.toUpperCase());
                const b = findFeature(endData.floor, c.name.toUpperCase());
                if (!a || !b) return;
                const r1 = routeOnFloor(startData.floor, startData.pos, layerPos(a));
                const r2 = routeOnFloor(endData.floor, layerPos(b), endData.pos);
                if (r1 && r2 && (!best || r1.dist + r2.dist < best.dist)) best = { c, r1, r2, a, b, dist: r1.dist + r2.dist };
            });
            if (!best) return alert("找不到可往返樓層的樓梯或電梯");
            via = best.c;
            legs.push({ floor: startData.floor, latlngs: best.r1.latlngs, connector: layerPos(best.a) });
            legs.push({ floor: endData.floor, latlngs: best.r2.latlngs, connector: layerPos(best.b) });
        }
        legs.forEach(l => {
            const leg = { floor: l.floor, via };
            leg.line = L.polyline(l.latlngs, { color: '#ff4757', weight: 8, opacity: 0.8, dashArray: '8, 12' }).addTo(floors[l.floor].group);
            if (l.connector) leg.connectorMarker = L.marker(l.connector, { icon: connectorIcon(via), title: via.short }).bindPopup(`<b>${via.name}</b>`).addTo(floors[l.floor].group);
            routeLegs.push(leg);
        });
        currentInput = ""; document.getElementById('combinedInput').value = "";
        document.getElementById('keypadSection').classList.remove('active');
        showFloor(startData.floor); // 先顯示起點所在樓層的第 1 段路徑
    }

    // 顯示用編號：車格補零為三碼，例如 B1F-052；柱號、區域名稱維持原樣
    function pointLabel(p) {
        return `${FLOOR_CONFIG[p.floor].label}-${/^\d+$/.test(p.name) ? p.name.padStart(3, '0') : p.name}`;
    }

    function updateRouteStatus() {
        const box = document.getElementById('routeStatus');
        if (!routeLegs.length) {
            // 只設定了終點（例如由「指引」帶入），提示設定起點
            if (endData && !startData) {
                box.style.display = "block";
                box.innerHTML = `終點 ${pointLabel(endData)}<span class="route-hint">請輸入或點選目前位置，設為起點</span>`;
            } else if (startData && !endData && fixedStart) {
                box.style.display = "block";
                box.innerHTML = `目前位置 ${pointLabel(startData)}<span class="route-hint">請點選地圖上的車格或柱號，即開始導航</span>`;
            } else {
                box.style.display = "none";
            }
            return;
        }
        const s = pointLabel(startData), e = pointLabel(endData);
        box.style.display = "block";
        if (routeLegs.length === 1) { box.innerHTML = `${s} ➔ ${e}`; return; }
        const via = routeLegs[0].via;
        if (currentFloor === startData.floor) {
            box.innerHTML = `${s} ➔ ${ciImg(via, 18)} ${via.short}<span class="route-hint">抵達後前往 ${endData.floor}，再至 ${e}</span>`
                + `<button class="route-next" onclick="showFloor('${endData.floor}')">已到達，切換至 ${endData.floor} ▶</button>`;
        } else {
            box.innerHTML = `${ciImg(via, 18)} ${via.short} ➔ ${e}<span class="route-hint">第 2 段（${endData.floor}）</span>`
                + `<button class="route-next" style="background:#636e72" onclick="showFloor('${startData.floor}')">◀ 回到 ${startData.floor} 第 1 段</button>`;
        }
    }

    // --- 互動功能 ---
    window.setPointViaMap = function(floor, name, type) {
        const targetLayer = findFeature(floor, name.toString().toUpperCase());
        if (!targetLayer) return;

        if (!targetLayer.feature.properties.road_id) {
            alert("此區域不可作為起點或終點");
            return;
        }

        if (type === 'from') fixedStart = null; // 手動設定起點即取消固定起點
        applyPoint(floor, name, layerPos(targetLayer), type);
        map.closePopup();
    }

    function appendKey(k) { if (currentInput.length < 3) currentInput += k; document.getElementById('combinedInput').value = currentInput; }

    function resetActiveSpot() {
        if (!activeSpot) return;
        const f = floors[activeSpot.floor], l = activeSpot.layer;
        activeSpot = null;
        // 清除搜尋選中時，判斷是否要回到車位占用樣式
        if (isOccupancyMode && f.occupied.has(l.feature.properties.name.toString())) l.setStyle(OCCUPIED_STYLE);
        else f.geojson.resetStyle(l);
    }

    function clearInput(fullReset = false) {
        currentInput = ""; document.getElementById('combinedInput').value = "";
        resetActiveSpot();
        if (fullReset) {
            clearRoute();
            removeMarker(startMarker);
            removeMarker(endMarker);
            startData = null; endData = null; startMarker = null; endMarker = null;
            // 固定起點模式下重新搜尋時保留起點
            if (fixedStart) applyPoint(fixedStart.floor, fixedStart.name, fixedStart.pos, 'from');
            showFloor(currentFloor);
        }
    }

    function toggleKeypad() {
        const keypad = document.getElementById('keypadSection');
        // 已完成一次導航才重置；只設定了起點或終點時保留，方便接續輸入
        if (!keypad.classList.contains('active')) clearInput(!!(startData && endData));
        keypad.classList.toggle('active');
    }

    function setPoint(type) {
        if (!currentInput || !floors[currentFloor].geojson) return;
        const targetName = formatInput(currentInput);
        const target = findFeature(currentFloor, targetName);

        if (!target) return alert(notFoundMsg(currentFloor, targetName));

        if (!target.feature.properties.road_id) {
            alert("此編號不可作為導航點（未配置路徑）");
            return;
        }

        if (type === 'from') fixedStart = null; // 手動設定起點即取消固定起點
        applyPoint(currentFloor, targetName, layerPos(target), type);
    }

    function applyPoint(floor, name, pos, type) {
        const group = floors[floor].group;
        if (type === 'from') {
            startData = { floor, name, pos };
            removeMarker(startMarker);
            startMarker = L.circleMarker(pos, { radius: 10, color: '#0984e3', fillColor: '#0984e3', fillOpacity: 1 }).addTo(group);
        } else {
            endData = { floor, name, pos };
            removeMarker(endMarker);
            endMarker = L.marker(pos, { icon: redFlagIcon }).addTo(group);
        }
        if (startData && endData) drawRoute();
        else { currentInput = ""; document.getElementById('combinedInput').value = ""; updateRouteStatus(); }
    }

    function setFixedStart(str, preferFloor) {
        const p = resolvePoint(str, preferFloor);
        if (!p) return alert("找不到起點：" + str);
        fixedStart = { floor: p.floor, name: p.name, pos: layerPos(p.layer) };
        clearInput(true);
        showFloor(p.floor);
        map.setView(fixedStart.pos, 20);
    }

    // offsetY：目標往畫面下方偏移的像素，避免被搜尋面板遮住
    function highlightSpot(floor, l, offsetY = 0) {
        resetActiveSpot();
        showFloor(floor);
        const center = map.unproject(map.project(layerPos(l), 21).subtract([0, offsetY]), 21);
        map.setView(center, 21);
        l.setStyle(HIGHLIGHT_STYLE);
        if (!offsetY) l.openPopup();
        activeSpot = { floor, layer: l };
    }

    function executeSearch() {
        if (!currentInput || !floors[currentFloor].geojson) return;
        const targetName = formatInput(currentInput);
        const l = findFeature(currentFloor, targetName);
        if (l && l.feature.properties.road_id) {
            highlightSpot(currentFloor, l);
            document.getElementById('keypadSection').classList.remove('active');
        } else {
            alert(l ? "找不到具備路徑配置的有效編號: " + targetName : notFoundMsg(currentFloor, targetName));
        }
    }

    // 「停泊即時資訊」尋車結果按下「指引」：設定該車格為終點，再請使用者設定起點
    // 網址 ?guide= 帶入時 floorStr 為空，另可接受柱號、區域名稱，preferFloor 指定同名項目的樓層
    function startGuide(floorStr, spotStr, preferFloor) {
        let p = null;
        if (floorStr) {
            const code = parseSpotCode(floorStr, spotStr);
            const layer = code && findFeature(code.floor, code.spot);
            if (layer) p = { floor: code.floor, name: code.spot, layer };
        } else {
            p = resolvePoint(String(spotStr), preferFloor);
        }
        if (!p) return alert("找不到目的地：" + spotStr);
        clearInput(true);
        applyPoint(p.floor, p.name, layerPos(p.layer), 'to');
        document.getElementById('keypadSection').classList.add('active');
        // 讓目標落在搜尋面板下方，避免在手機上被鍵盤遮住
        const panel = document.querySelector('.search-container');
        highlightSpot(p.floor, p.layer, (panel.offsetTop + panel.offsetHeight) / 2);
    }

    // 維修使用：點擊地圖任何地方，自動在控制台輸出經緯度
    map.on('click', function(e) {
        console.log(`[${currentFloor}] "name": "請填號碼", "coords": [${e.latlng.lng}, ${e.latlng.lat}]`);
    });

    /**
     * 功能 A: [停車場現況彈窗]
     */
    (function() {
        window.addEventListener('load', function() {
            const modal = document.getElementById('modalOverlay');
            const openBtn = document.getElementById('openInstant');
            const closeBtn = document.getElementById('closeModal');
            const refreshBtn = document.getElementById('refreshModal');
            const iframe = document.getElementById('instantIframe');

            if (!openBtn || !modal) return;

            const openModal = (e) => {
                e.preventDefault();
                iframe.src = "instant.html?t=" + new Date().getTime();
                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';
            };

            const closeModal = () => {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
                iframe.src = "";
            };

            openBtn.addEventListener('click', openModal);
            if (closeBtn) closeBtn.addEventListener('click', closeModal);
            if (refreshBtn) refreshBtn.addEventListener('click', () => {
                iframe.src = "instant.html?t=" + new Date().getTime();
            });

            // 點擊背景關閉
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // 接收 instant.html「指引」按鈕的訊息：關閉彈窗後進行車格導引
            window.addEventListener('message', (e) => {
                if (e.origin !== location.origin || !e.data || e.data.type !== 'parking-guide') return;
                closeModal();
                dataReady.then(() => startGuide(e.data.floor, e.data.spot));
            });
        });
    })();

</script>
